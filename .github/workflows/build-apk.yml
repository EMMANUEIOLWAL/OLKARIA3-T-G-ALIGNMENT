name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Olkaria3-TG-Alignment.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Olkaria3-TG-Alignment-APK
          path: Olkaria3-TG-Alignment.apk
      - name: Publish phone download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Olkaria3-TG-Alignment.apk \
            --target "$GITHUB_SHA" \
            --title "Olkaria 3 TG Alignment (latest)" \
            --notes "Tap Olkaria3-TG-Alignment.apk below to download, then open it to install. Built from ${GITHUB_SHA::7}."
